spring.application.name=territory-predictive-insights

# Aplicacao de console (menu): sem servidor web e sem banner
spring.main.web-application-type=none
spring.main.banner-mode=off

# ---------- Banco H2 em ARQUIVO (pasta ./data, criada sozinha na 1a execucao) ----------
# Os dados sobrevivem ao reiniciar o programa. Para zerar o historico, apague a pasta ./data
spring.datasource.url=jdbc:h2:file:./data/territory
spring.datasource.username=sa
spring.datasource.password=

# ---------- JPA / Hibernate ----------
# Cria/atualiza as tabelas MEDICAO e ALERTA automaticamente (DDL de referencia em sql/schema.sql)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Console limpo: so mostra avisos/erros (o menu fica legivel)
logging.level.root=WARN
